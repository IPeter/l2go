# Overrides for Mobius's game/config/Server.ini (reference stack).
# start.sh copies Mobius's defaults and sets these keys at every start;
# everything else stays Mobius default.

# The login server is the mobius-login service. The link (LoginPort 9014,
# Mobius default) stays on the compose network.
LoginHost = mobius-login

# The game port, which is also the port the login server announces to clients.
# Compose publishes it as 127.0.0.1:17777, so container and host ports match.
# The announced address (127.0.0.1) is in ipconfig.xml.
GameserverPort = 17777

# Blowfish-encrypted game packets, like L2Go (Mobius's default is False).
PacketEncryption = True

# The Interlude client protocol (Mobius's default).
AllowedProtocolRevisions = 746
