# Overrides for Mobius's login/config/Server.ini (reference stack).
# start.sh copies Mobius's defaults and sets these keys at every start;
# everything else stays Mobius default.

# Listen for game servers on every interface (default 127.0.0.1): the game
# server connects over the compose network, to mobius-login:9014 (LoginPort,
# Mobius default). That port is not published to the host.
LoginHostname = *

# Mobius's defaults, set so the reference never depends on them: any game
# server may register (no GameServerRegister/hexid step), and a login with an
# unknown account creates it.
AcceptNewGameServer = True
AutoCreateAccounts = True
