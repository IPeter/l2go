# Local stack: MongoDB, the login server and game server 1.
#
#   make up      (docker compose up --build)
#   make down
#   L2GO_LOG_LEVEL=debug make up    for packet dumps
#
# Clients connect to port 2106 (login) and 7777 (game) of this machine, from
# this machine or any other on the network. The server list announces the
# game server at L2GO_PUBLIC_IP, which `make up` sets to this machine's LAN
# IP (override: make up PUBLIC_IP=1.2.3.4). With plain `docker compose up`
# it is 127.0.0.1, which only works for a client on this machine.
# Servers read deploy/compose/server.json, which uses the service names
# below as host names.
#
# The game server reads the Lua scripts from ./scripts (mounted read-only).
# Saving a script reloads it (devReload in deploy/compose/server.json). To
# reload by hand: make reload-scripts (docker compose kill -s HUP game).
#
# Geodata: the game server reads L2J X_Y.l2j tiles from the folder
# GEODATA_DIR (default ./geodata, which holds none: bring your own, see the
# README), mounted read-only at /opt/l2go/geodata (geodata.dir in
# deploy/compose/server.json). Without tiles it runs without geodata. The
# Mobius reference stack mounts the same folder.
#
# The game data is part of the image: data/, plus the NPC dialog pages in
# data/html once `make data` has copied them from the Mobius checkout.
# `make up` rebuilds the image, so it always has the current data.

name: l2go

x-l2go: &l2go
  build: .
  image: l2go:dev
  restart: on-failure
  environment:
    # The game server address in the server list (see deploy/compose/server.json).
    # `make up` sets it to this machine's LAN IP.
    L2GO_PUBLIC_IP: ${L2GO_PUBLIC_IP:-127.0.0.1}
  volumes:
    - ./deploy/compose/server.json:/etc/l2go/server.json:ro

services:
  mongo:
    image: mongo:8
    # A one-node replica set, rs0: the game server writes a character and its
    # items in one transaction, and MongoDB has transactions only on replica
    # sets. On the first start the healthcheck initiates the set with this
    # node as mongo:27017 (an existing standalone volume keeps its data), and
    # it reports healthy only once this node is the primary, so the servers
    # start after that. Servers connect with
    # mongodb://mongo:27017/?replicaSet=rs0 (deploy/compose/server.json).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    # Published on localhost only, for `make integration` and local tools.
    # From the host, connect directly, because the set's member name mongo
    # only resolves inside compose:
    #   mongosh "mongodb://127.0.0.1:27017/?directConnection=true"
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          if (e.codeName !== 'NotYetInitialized') throw e;
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }
          if (!db.adminCommand({hello: 1}).isWritablePrimary) throw new Error('not the primary yet')
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  login:
    <<: *l2go
    command: ["login", "-config", "/etc/l2go/server.json", "-log-level", "${L2GO_LOG_LEVEL:-info}"]
    # 2106 is for clients. 9413 (game server link) stays on the compose
    # network and is not published.
    ports:
      - "2106:2106"
    depends_on:
      mongo:
        condition: service_healthy

  game:
    <<: *l2go
    command: ["game", "-id", "1", "-config", "/etc/l2go/server.json", "-log-level", "${L2GO_LOG_LEVEL:-info}"]
    # Replaces the volumes of x-l2go, so the config is listed again.
    volumes:
      - ./deploy/compose/server.json:/etc/l2go/server.json:ro
      - ./scripts:/opt/l2go/scripts:ro
      - ${GEODATA_DIR:-./geodata}:/opt/l2go/geodata:ro
    ports:
      - "7777:7777"
    # On stop the game server saves every player in the world before it
    # exits; Docker's default 10 s before SIGKILL can cut that short.
    stop_grace_period: 1m
    # The game server stores characters in mongo and registers with the
    # login server at login:9413. If the login server is not listening yet,
    # or restarts later, the game server keeps retrying the link; until it
    # is up, clients get "system error" at AuthLogin.
    depends_on:
      mongo:
        condition: service_healthy
      login:
        condition: service_started

volumes:
  mongo-data:
