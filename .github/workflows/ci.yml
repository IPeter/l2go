name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: make lint

      - name: Check Lua scripts
        run: make scripts-check

      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Vulnerability check
        run: make vuln

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Service containers can't take command args, and transactions need a
      # replica set, so start a one-node rs0 by hand.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0
          timeout 120 sh -c 'until docker exec mongo mongosh --quiet --eval "rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}).ok"; do sleep 2; done'
          timeout 60 sh -c 'until docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 1; done'

      - name: MongoDB integration tests
        env:
          L2GO_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
        run: go test -tags integration -count=1 ./internal/storage/...
